<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <!-- meta情報 -->
    <title>animation</title>
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <!-- ogp -->
    <meta property="og:title" content="" />
    <meta property="og:type" content="" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:site_name" content="" />
    <meta property="og:description" content="" />
    <!-- ファビコン -->
    <link rel="”icon”" href="" />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./css/styles.css" />

    <!-- JavaScript -->

    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/ScrollTrigger.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script defer src="./js/script.js"></script>
  </head>
  <body>
    <section class="gallery">
      <div class="gallery__texts">
        <h2 class="gallery__title">parallax</h2>
        <p class="gallery__text">パラパラ美味しそうな写真がたくさんあるね</p>
      </div>
      <div class="gallery__item gallery-item--01"></div>
      <div class="gallery__items">
        <div class="gallery__item gallery-item-02">
          <div class="gallery-item-02__imgs1">
            <div class="gallery-item-02__img1-1 js-parallax-large">
              <picture>
                <source srcset="./images/common/img1.jpg.webp" type="image/webp" />
                <img src="./images/common/img1.jpg" alt="茶葉のイメージ" />
              </picture>
            </div>
            <div class="gallery-item-02__img1-2 js-parallax-small">
              <picture>
                <source srcset="./images/common/img2.jpg.webp" type="image/webp" />
                <img src="./images/common/img2.jpg" alt="食器" />
              </picture>
            </div>
          </div>
          <div class="gallery-item-02__imgs2">
            <div class="gallery-item-02__img2-1 js-parallax-normal">
              <picture>
                <source srcset="./images/common/img5.jpg.webp" type="image/webp" media="(max-width:767px)" />
                <source srcset="./images/common/img5.jpg" media="(max-width:767px)" />
                <source srcset="./images/common/img3.jpg.webp" type="image/webp" />
                <img src="./images/common/img3.jpg" alt="料理のイメージ" />
              </picture>
            </div>
            <div class="gallery-item-02__img2-2 js-parallax-large2">
              <picture>
                <source srcset="./images/common/img4.jpg.webp" type="image/webp" />
                <img src="./images/common/img4.jpg" alt="地面の写真" />
              </picture>
            </div>
          </div>
          <div class="gallery-item-02__imgs3">
            <div class="gallery-item-02__img3-1 js-parallax-large2">
              <picture>
                <source srcset="./images/common/img3.jpg.webp" type="image/webp" media="(max-width:767px)" />
                <source srcset="./images/common/img3.jpg" media="(max-width:767px)" />
                <source srcset="./images/common/img5.jpg.webp" type="image/webp" />
                <img src="./images/common/img5.jpg" alt="丸い食器に盛られた料理" />
              </picture>
            </div>
            <div class="gallery-item-02__img3-2 js-parallax-small">
              <picture>
                <source srcset="./images/common/img6.jpg.webp" type="image/webp" />
                <img src="./images/common/img6.jpg" alt="いちごのデザート" />
              </picture>
            </div>
          </div>
        </div>
        <div class="gallery__item gallery-item-03">
          <div class="gallery-item-03__imgs1">
            <div class="gallery-item-03__img1-1 js-parallax-normal">
              <picture>
                <source srcset="./images/common/img7.jpg.webp" type="image/webp" />
                <img src="./images/common/img7.jpg" alt="茶碗のイメージ" />
              </picture>
            </div>
          </div>
          <div class="gallery-item-03__imgs2">
            <div class="gallery-item-03__img2-1 js-parallax-large2">
              <picture>
                <source srcset="./images/common/img8.jpg.webp" type="image/webp" />
                <img src="./images/common/img8.jpg" alt="差し込む光" />
              </picture>
            </div>
            <div class="gallery-item-03__img2-2 js-parallax-large">
              <picture>
                <source srcset="./images/common/img9.jpg.webp" type="image/webp" />
                <img src="./images/common/img9.jpg" alt="石の食器に盛られたお肉" />
              </picture>
            </div>
          </div>
          <div class="gallery-item-03__imgs3">
            <div class="gallery-item-03__img3-1 js-parallax-small">
              <picture>
                <source srcset="./images/common/img10.jpg.webp" type="image/webp" />
                <img src="./images/common/img10.jpg" alt="小鉢に盛られた料理" />
              </picture>
            </div>
          </div>
        </div>
        <div class="gallery__item gallery-item-04"></div>
      </div>
    </section>
  </body>
</html>
